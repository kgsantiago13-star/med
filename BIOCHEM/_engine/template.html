<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biochem LE1 Slide Reviewer (1.1.1 to 1.6)</title>
<style>
:root{
  --bg:#f6f1ef; --panel:#fffdfb; --ink:#2c1b30; --ink-soft:#6b5a6e;
  --hema:#4a2e6b; --hema-deep:#351f4d; --eosin:#e0668c; --eosin-deep:#c14a6f;
  --gold:#c99a3c; --good:#3f7a53; --bad:#c0483f;
  --ring:rgba(74,46,107,0.35); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  color:var(--ink); min-height:100vh; padding:18px 14px 40px;
  background:
    radial-gradient(circle at 12% 18%, rgba(224,102,140,0.10), transparent 40%),
    radial-gradient(circle at 88% 82%, rgba(74,46,107,0.12), transparent 45%),
    var(--bg);
  background-attachment:fixed;
}
.ui,button,.chip,.bdg,summary,th,.kicker,figcaption,.fb,.opt,.foot,input{font-family:'Trebuchet MS',system-ui,sans-serif}
.app{max-width:920px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--eosin-deep);margin-bottom:3px}
header.top h1{font-size:22px;margin:0;color:var(--hema-deep);line-height:1.2}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--hema-deep);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--hema-deep);padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--hema-deep);color:#fff}
.pill{border:1.5px solid var(--hema-deep);background:transparent;color:var(--hema-deep);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.pill:hover{background:rgba(74,46,107,.07)}
.secnav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid #e2d6db;background:#fff;color:var(--ink);border-radius:12px;padding:6px 10px;font-size:12px;cursor:pointer;line-height:1.25;text-align:left}
.chip b{display:block;font-size:12.5px;color:var(--hema-deep)}
.chip small{color:var(--ink-soft);font-size:11px}
.chip.on{border-color:var(--hema);background:#f3ecf8}
.chip .mini{display:block;height:3px;border-radius:3px;background:#e9dfe4;margin-top:4px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:var(--gold);width:0}
.pbar{height:6px;border-radius:6px;background:#e9dfe4;overflow:hidden;margin:2px 0 4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--eosin),var(--hema));transition:width .25s}
.pmeta{display:flex;justify-content:space-between;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.card{
  position:relative;overflow:hidden;background:var(--panel);border-radius:var(--radius);
  border:1px solid #ece2e6;padding:26px 28px 24px;min-height:340px;
  box-shadow:0 1px 2px rgba(44,27,48,0.04),0 12px 30px -12px rgba(74,46,107,0.18);
}
.card::before{content:"";position:absolute;top:-70px;right:-70px;width:190px;height:190px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(224,102,140,0.16),transparent 70%)}
.card>*{position:relative}
.skick{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--eosin-deep);margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.bdg{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.bdg.must{background:rgba(201,154,60,.14);color:#8a6414;border-color:rgba(201,154,60,.45);font-weight:700}
.bdg.core{background:rgba(74,46,107,.08);color:var(--hema);border-color:rgba(74,46,107,.25)}
.bdg.tm{background:rgba(192,72,63,.09);color:#8a332c;border-color:rgba(192,72,63,.35)}
.bdg.lo{background:transparent;color:var(--hema);border-color:rgba(74,46,107,.35)}
.bdg.add{background:rgba(201,154,60,.1);color:#8a6414;border-color:rgba(201,154,60,.4)}
h2.st{font-size:24px;line-height:1.28;margin:0 0 12px;color:var(--hema-deep)}
.body{font-size:17px;line-height:1.6}
.body p{margin:0 0 10px}
.body ul,.body ol{margin:0 0 10px;padding-left:22px}
.body li{margin-bottom:5px}
.body b,.body strong{color:var(--hema-deep)}
.lead{font-size:19px;line-height:1.5;margin:0 0 12px}
.small{font-size:14px;color:var(--ink-soft)}
.ui-text{font-family:'Trebuchet MS',system-ui,sans-serif}
table.t{border-collapse:collapse;width:100%;margin:8px 0 12px;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:14px;line-height:1.4}
table.t th{background:#f3ecf8;color:var(--hema-deep);text-align:left;font-size:12.5px;padding:7px 9px;border:1px solid #e2d6db}
table.t td{padding:6px 9px;border:1px solid #e9dfe4;vertical-align:top}
table.t tr:nth-child(even) td{background:#fcf9fb}
.tw{overflow-x:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:8px 0 12px}
.box{border:1px solid #e9dfe4;border-radius:12px;padding:11px 13px;background:#fff;font-size:15px;line-height:1.5}
.box h4{margin:0 0 5px;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--eosin-deep)}
.box.g{border-left:4px solid var(--good)} .box.r{border-left:4px solid var(--bad)} .box.p{border-left:4px solid var(--hema)} .box.y{border-left:4px solid var(--gold)}
.addnote{border-left:3px solid var(--gold);background:rgba(201,154,60,.09);padding:9px 12px;margin:10px 0;border-radius:0 8px 8px 0;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:14px;line-height:1.55}
.addnote.err{border-left-color:var(--bad);background:rgba(192,72,63,.09)}
.memo{border:1.5px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fffaf0}
.memo .mh{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a6414;margin-bottom:4px}
.memo .mn{font-size:22px;font-weight:700;color:var(--hema-deep);letter-spacing:.02em;margin-bottom:6px}
.memo .mp{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:14.5px;line-height:1.55}
.memo .mp span.l{display:inline-block;min-width:22px;font-weight:700;color:var(--eosin-deep)}
.memo.added{border-color:var(--hema);background:#f7f2fb}
.memo.added .mh{color:var(--hema)}
figure.fig{margin:8px 0 12px}
figure.fig img{max-width:100%;height:auto;display:block;border-radius:10px;border:1px solid #e7dde1;background:#fff;margin:0 auto}
figure.fig figcaption{font-size:11.5px;color:var(--ink-soft);margin-top:5px;text-align:center}
.figrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
details.extra{border:1px solid #e2d6db;border-radius:12px;padding:8px 13px;margin:10px 0;background:#fcf9fb}
details.extra summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);font-weight:700}
details.extra[open] summary{margin-bottom:8px}
details.dec{border:1.5px solid rgba(74,46,107,.35);border-radius:12px;padding:10px 14px;margin:12px 0;background:#f7f2fb}
details.dec summary{cursor:pointer;color:var(--hema-deep);font-weight:700;font-size:13px}
details.dec .dq{font-size:16px;line-height:1.5;margin:8px 0}
details.dec .dq ol{margin:4px 0 0;padding-left:20px;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:14px}
.dec .dg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:8px}
.dec .dg div{background:#fff;border:1px solid #e2d6db;border-radius:10px;padding:8px 10px;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:13.5px;line-height:1.5}
.dec .dg b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--eosin-deep);margin-bottom:2px}
.rq{border-top:1px solid #ece2e6;padding:14px 0 6px}
.rq:first-of-type{border-top:0}
.rq .qn{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--eosin-deep);margin-bottom:4px}
.rq .qt{font-size:18px;line-height:1.5;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;font-size:15px;line-height:1.4;color:var(--ink);background:#fff;border:1.5px solid #e2d6db;border-radius:12px;padding:10px 13px;transition:border-color .15s,background .15s,transform .12s}
.opt:hover:not(.locked){border-color:var(--ring);transform:translateY(-1px)}
.opt .bd{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#f1e9ec;color:var(--hema-deep);font-weight:700;font-size:13px}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--good);background:#eef6f0}.opt.correct .bd{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fbeeed}.opt.wrong .bd{background:var(--bad);color:#fff}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6;animation:fadeIn .28s ease both}
.fb.ok{background:#eef6f0;color:#2c5a3c;border:1px solid #cfe6d5}
.fb.no{background:#fbeeed;color:#8a332c;border:1px solid #f0d3cf}
.fb.info{background:#f7f2fb;color:#3d2a55;border:1px solid #e2d6ee}
.fb p{margin:0 0 6px}.fb ul{margin:4px 0 6px;padding-left:18px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.revbtn{margin:2px 0 0;border:1.5px solid var(--hema-deep);background:transparent;color:var(--hema-deep);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.flash .fa{margin-top:8px}
.navrow{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px}
.btn{font-size:14px;font-weight:600;border-radius:999px;padding:11px 24px;cursor:pointer;border:1.5px solid var(--hema-deep);transition:opacity .2s,transform .2s,background .15s}
.btn.next{background:var(--hema-deep);color:#fff}
.btn.prev{background:transparent;color:var(--hema-deep)}
.btn[disabled]{opacity:.35;cursor:default}
.counter{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:12px;color:var(--ink-soft);text-align:center;flex:1}
.foot{margin-top:22px;text-align:center;font-size:11.5px;color:#b8a7ae}
#drawer{position:fixed;inset:0;background:rgba(44,27,48,.45);display:none;z-index:20}
#drawer.open{display:block}
#dpanel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--panel);padding:16px 16px 30px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
#dpanel h3{margin:0 0 8px;color:var(--hema-deep);font-size:18px}
#dq{width:100%;padding:9px 12px;border:1.5px solid #e2d6db;border-radius:10px;font-size:14px;margin-bottom:8px}
.dsec{margin:10px 0 2px;font-family:'Trebuchet MS',system-ui,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--eosin-deep)}
.ditem{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:8px;font-size:13.5px;line-height:1.35;cursor:pointer;color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif}
.ditem:hover{background:#f3ecf8}
.ditem.cur{background:#f3ecf8;font-weight:700}
.ditem .tag{color:#8a6414;font-weight:700}
.stat{font-family:'Trebuchet MS',system-ui,sans-serif;font-size:14px}
.stat .row{display:flex;justify-content:space-between;border-bottom:1px solid #ece2e6;padding:5px 0}
svg text{font-family:'Trebuchet MS',system-ui,sans-serif}
.svgbox{margin:8px 0 12px;border:1px solid #e7dde1;border-radius:10px;background:#fff;padding:6px;overflow-x:auto}
.svgbox svg{display:block;margin:0 auto;max-width:100%;height:auto}
@media (max-width:600px){.card{padding:20px 16px}h2.st{font-size:21px}.body{font-size:16px}header.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="kicker">Medical Biochemistry · Module 1 · LE 1</div><h1 id="ttl">Slide Reviewer: 1.1.1 to 1.6</h1></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Study path"><button id="mFull" class="on">Full path</button><button id="mFast">Fast path</button></div>
      <button class="pill" id="bMenu">☰ Contents</button>
    </div>
  </header>
  <nav class="secnav" id="secnav"></nav>
  <div class="pbar"><i id="pfill"></i></div>
  <div class="pmeta"><span id="pl">Slide 1</span><span id="pr"></span></div>
  <article class="card" id="card" aria-live="polite"></article>
  <div class="navrow">
    <button class="btn prev" id="bPrev">← Previous</button>
    <div class="counter" id="cnt"></div>
    <button class="btn next" id="bNext">Next →</button>
  </div>
  <div class="foot">Built from your eight transes, your shifting quiz photos, and Harper's Illustrated Biochemistry 32e (chapters 1 to 7 only). Study aid. It does not predict exam questions.</div>
</div>
<div id="drawer"><div id="dpanel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Contents</h3><button class="pill" id="bClose">Close ✕</button></div><input id="dq" placeholder="Search slides (for example: Km, BPG, cardiolipin)"><div id="dlist"></div></div></div>

</body>
